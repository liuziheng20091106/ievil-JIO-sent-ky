name: seven_double_client
description: Native Android and Windows client for Seven Double.
publish_to: none
version: 1.0.7+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # 直接使用，用于按本机时区格式化时间；测试里配合 withClock 固定「现在」。
  clock: ^1.1.1
  flutter_secure_storage: ^9.2.4
  # 直接使用，用于拼接 Windows 上两个插件的存储目录路径（旧数据迁移）。
  path: ^1.9.0
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  # 只用于渲染绘制的 SVG 图标（月代雪标志、行动图标），不引入状态或路由框架。
  flutter_svg: ^2.0.17
  # 公告正文是 markdown，要求渲染完整（表格、引用、代码块等），因此引入渲染包。
  flutter_markdown_plus: ^1.0.12

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/logo.png
    - assets/avatars/
    - assets/icons/
    # 静态 QQ 表情（经典 275 + 超级 50），由 temp/gen_emoji.py 从 QFace 导出。
    - assets/emoji/qq/

  fonts:
    - family: HarmonyOS Sans SC
      fonts:
        - asset: assets/fonts/HarmonyOS_Sans_SC_Regular.ttf
          weight: 400
        - asset: assets/fonts/HarmonyOS_Sans_SC_Medium.ttf
          weight: 500
        - asset: assets/fonts/HarmonyOS_Sans_SC_Bold.ttf
          weight: 700
